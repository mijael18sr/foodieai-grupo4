# =====================================================
# Restaurant Recommender - Docker Compose Configuration
# =====================================================
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   With MLflow: docker-compose --profile mlflow up -d

services:
  # ===========================================
  # Backend API Service
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MODEL_PATH=/app/data/models/
      - DATA_PATH=/app/data/
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend/data/models:/app/data/models:ro
      - ./backend/data/processed:/app/data/processed:ro
      - ./backend/data/raw:/app/data/raw:ro
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - restaurant-network
    depends_on:
      mlflow:
        condition: service_healthy
        required: false

  # ===========================================
  # Frontend Service
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
        - VITE_APP_NAME=${VITE_APP_NAME:-Restaurant Recommender}
    container_name: restaurant-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - restaurant-network

  # ===========================================
  # MLflow Tracking Server
  # ===========================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: restaurant-mlflow
    restart: unless-stopped
    profiles:
      - mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - restaurant-network

  # ===========================================
  # PostgreSQL Database (Optional - for production)
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: restaurant-postgres
    restart: unless-stopped
    profiles:
      - database
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-restaurant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-restaurant123}
      - POSTGRES_DB=${POSTGRES_DB:-restaurant_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network

  # ===========================================
  # Redis Cache (Optional - for production)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    restart: unless-stopped
    profiles:
      - cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network

# ===========================================
# Networks
# ===========================================
networks:
  restaurant-network:
    driver: bridge
    name: restaurant-network

# ===========================================
# Volumes
# ===========================================
volumes:
  backend-logs:
    name: restaurant-backend-logs
  mlflow-data:
    name: restaurant-mlflow-data
  postgres-data:
    name: restaurant-postgres-data
  redis-data:
    name: restaurant-redis-data
