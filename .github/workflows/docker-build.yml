# =====================================================
# Build Docker Images Only (for testing)
# =====================================================
# Triggered on PRs to validate Docker builds

name: Docker Build Test

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build.yml'

jobs:
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: restaurant-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: restaurant-frontend:test
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-test:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test environment file
        run: |
          cat > .env << EOF
          DEBUG=true
          ENVIRONMENT=testing
          BACKEND_PORT=8000
          FRONTEND_PORT=80
          VITE_API_BASE_URL=http://localhost:8000
          EOF

      - name: Validate docker-compose configuration
        run: docker compose config

      - name: Build with docker-compose
        run: docker compose build --no-cache

      - name: Start services
        run: |
          docker compose up -d backend
          sleep 30
          docker compose ps

      - name: Check backend health
        run: |
          docker compose logs backend
          curl -f http://localhost:8000/health || echo "Health check endpoint not ready"

      - name: Cleanup
        if: always()
        run: docker compose down -v
