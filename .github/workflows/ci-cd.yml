# =====================================================
# CI/CD Pipeline for Restaurant Recommender
# =====================================================
# Optimized for AWS Free Tier (EC2 t2.micro + Docker)
# Triggers on push to main and pull requests

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_BACKEND: restaurant-recommender-backend
  ECR_REPOSITORY_FRONTEND: restaurant-recommender-frontend

jobs:
  # ===========================================
  # Backend Tests
  # ===========================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('wordnet')"

      - name: Run linting
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        working-directory: ./backend
        run: |
          pytest test/ -v --cov=src --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # ===========================================
  # Frontend Tests
  # ===========================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  # ===========================================
  # Build and Push Docker Images
  # ===========================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Backend image
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Frontend image
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.PRODUCTION_API_URL }} \
            --build-arg VITE_APP_NAME="Restaurant Recommender" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ===========================================
  # Deploy to EC2 (Free Tier)
  # ===========================================
  deploy-ec2:
    name: Deploy to EC2 (Free Tier)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Instance IP
        id: get-ec2
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=restaurant-recommender-app-server" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_OUTPUT
          echo "EC2 Instance IP: $EC2_IP"

      - name: Create deployment files
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          # Create docker-compose for production
          cat > docker-compose.ec2.yml << 'EOF'
          version: '3.8'
          
          services:
            backend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:latest
              container_name: restaurant-backend
              restart: always
              ports:
                - "8000:8000"
              environment:
                - ENVIRONMENT=production
                - LOG_LEVEL=info
                - CORS_ORIGINS=*
              volumes:
                - backend-data:/app/data
                - mlflow-artifacts:/app/mlartifacts
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
            
            frontend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:latest
              container_name: restaurant-frontend
              restart: always
              ports:
                - "80:80"
              depends_on:
                - backend
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:80"]
                interval: 30s
                timeout: 10s
                retries: 3
          
          volumes:
            backend-data:
            mlflow-artifacts:
          EOF

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ steps.get-ec2.outputs.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        env:
          EC2_IP: ${{ steps.get-ec2.outputs.EC2_IP }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          # Copy docker-compose file to EC2
          scp -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no \
            docker-compose.ec2.yml ec2-user@$EC2_IP:/home/ec2-user/app/docker-compose.yml
          
          # Deploy on EC2
          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no ec2-user@$EC2_IP << 'DEPLOY_SCRIPT'
            set -e
            
            # Set environment variables
            export AWS_REGION="us-east-1"
            export ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
            export ECR_REPOSITORY_BACKEND="${{ env.ECR_REPOSITORY_BACKEND }}"
            export ECR_REPOSITORY_FRONTEND="${{ env.ECR_REPOSITORY_FRONTEND }}"
            
            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            # Navigate to app directory
            cd /home/ec2-user/app
            
            # Create .env file for docker-compose
            cat > .env << ENV
          ECR_REGISTRY=$ECR_REGISTRY
          ECR_REPOSITORY_BACKEND=$ECR_REPOSITORY_BACKEND
          ECR_REPOSITORY_FRONTEND=$ECR_REPOSITORY_FRONTEND
          ENV
            
            # Pull latest images
            docker-compose pull
            
            # Stop existing containers gracefully
            docker-compose down --remove-orphans || true
            
            # Start new containers
            docker-compose up -d
            
            # Wait for services to be healthy
            sleep 30
            
            # Check container status
            docker-compose ps
            
            # Cleanup old images to save disk space
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
          DEPLOY_SCRIPT

      - name: Health Check
        env:
          EC2_IP: ${{ steps.get-ec2.outputs.EC2_IP }}
        run: |
          echo "Waiting for services to start..."
          sleep 15
          
          # Check backend health
          echo "Checking backend health..."
          curl -sf http://$EC2_IP:8000/health || echo "Backend health check pending..."
          
          # Check frontend
          echo "Checking frontend..."
          curl -sf http://$EC2_IP/ || echo "Frontend check pending..."
          
          echo "🚀 Deployment URLs:"
          echo "Frontend: http://$EC2_IP"
          echo "Backend API: http://$EC2_IP:8000"
          echo "API Docs: http://$EC2_IP:8000/docs"

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2-key.pem

      - name: Deployment Summary
        if: always()
        run: |
          echo "============================================="
          echo "Deployment Summary"
          echo "============================================="
          echo "Status: ${{ job.status }}"
          echo "Environment: production (EC2 Free Tier)"
          echo "EC2 IP: ${{ steps.get-ec2.outputs.EC2_IP }}"
          echo "Backend Image: ${{ needs.build-and-push.outputs.backend-image }}"
          echo "Frontend Image: ${{ needs.build-and-push.outputs.frontend-image }}"
          echo "============================================="

  # ===========================================
  # Notify (Optional)
  # ===========================================
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-ec2]
    if: always()
    
    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy-ec2.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed or was skipped"
          fi
